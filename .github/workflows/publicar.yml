name: Publicar en Instagram

# Horarios en UTC (Chile = UTC-3). Se usa el minuto 7: las horas en punto son las mas
# congestionadas en GitHub y las ejecuciones se atrasan o se saltan.
on:
  schedule:
    # Lunes a jueves (Chile): 09:07, 12:07, 15:07, 18:07
    - cron: "7 12,15,18,21 * * 1-4"
    # Lunes a jueves (Chile): 21:07 y 23:07 -> en UTC ya es martes a viernes
    - cron: "7 0,2 * * 2-5"
    # Viernes, sabado y domingo (Chile): cada hora de 09:07 a 20:07
    - cron: "7 12-23 * * 5,6,0"
    # Viernes, sabado y domingo (Chile): 21:07, 22:07 y 23:07 -> en UTC sabado, domingo y lunes
    - cron: "7 0-2 * * 6,0,1"
  # Reloj principal: cron-job.org llama a la API (workflow_dispatch) a la hora exacta.
  # Los horarios de arriba quedan de respaldo; si ya salio un post hace <50 min, no se repite.
  workflow_dispatch:
    inputs:
      forzar:
        description: "Publicar aunque haya salido un post hace poco"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Revisar si ya salio un post reciente
        id: chk
        env:
          FORZAR: ${{ inputs.forzar }}
        run: python3 scripts/ya_publicado.py >> "$GITHUB_OUTPUT"

      # ffmpeg y fuentes se bajan directo (sin apt: los espejos de Ubuntu a veces se cuelgan) y quedan en cache
      - name: Programas del sistema (cache)
        if: steps.chk.outputs.saltar != 'true'
        uses: actions/cache@v4
        with:
          path: ~/sysdeps
          key: sysdeps-ffmpeg-fuentes-v1

      - name: Programas del sistema (video, fuentes)
        if: steps.chk.outputs.saltar != 'true'
        timeout-minutes: 8
        run: |
          mkdir -p ~/sysdeps ~/.local/share/fonts && cd ~/sysdeps
          bajar() {
            [ -x ffmpeg ] || curl -sSL --retry 3 --max-time 180 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              | tar xJ --strip-components=1 --wildcards '*/ffmpeg' '*/ffprobe' || return 1
            [ -f InterVariable.ttf ] || { curl -sSL --retry 3 --max-time 60 -o inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip \
              && unzip -oq inter.zip InterVariable.ttf InterVariable-Italic.ttf && rm inter.zip; } || return 1
            [ -f NotoColorEmoji.ttf ] || curl -sSL --retry 3 --max-time 60 -o NotoColorEmoji.ttf \
              https://raw.githubusercontent.com/google/fonts/main/ofl/notocoloremoji/NotoColorEmoji-Regular.ttf || return 1
          }
          if bajar; then
            cp *.ttf ~/.local/share/fonts/ && fc-cache -f > /dev/null
            sudo ln -sf "$PWD/ffmpeg" /usr/local/bin/ffmpeg && sudo ln -sf "$PWD/ffprobe" /usr/local/bin/ffprobe
          else
            echo "::warning::Descarga directa fallo; se intenta con apt"
            timeout 300 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg fonts-inter fonts-noto-color-emoji > /dev/null
          fi
          ffmpeg -version | head -1

      - name: Dependencias de render
        if: steps.chk.outputs.saltar != 'true'
        working-directory: render
        run: npm ci --silent

      - name: Dependencias de Python
        if: steps.chk.outputs.saltar != 'true'
        run: pip install -q piper-tts numpy pillow scipy kokoro-onnx

      - name: Voces (cache)
        if: steps.chk.outputs.saltar != 'true'
        uses: actions/cache@v4
        with:
          path: voces
          key: voces-piper-kokoro-v1

      - name: Descargar voces si faltan
        if: steps.chk.outputs.saltar != 'true'
        run: |
          mkdir -p voces
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/claude/high
          [ -f voces/es_MX-claude-high.onnx ] || curl -sSL -o voces/es_MX-claude-high.onnx $B/es_MX-claude-high.onnx
          [ -f voces/es_MX-claude-high.onnx.json ] || curl -sSL -o voces/es_MX-claude-high.onnx.json $B/es_MX-claude-high.onnx.json
          K=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f voces/kokoro-v1.0.onnx ] || curl -sSL -o voces/kokoro-v1.0.onnx $K/kokoro-v1.0.onnx
          [ -f voces/voices-v1.0.bin ] || curl -sSL -o voces/voices-v1.0.bin $K/voices-v1.0.bin

      - name: Publicar siguiente post de la cola
        if: steps.chk.outputs.saltar != 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          export CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export KOKORO_DIR=$PWD/voces
          python3 scripts/publicar.py
