name: Publicar en Instagram

on:
  schedule:
    # Horario UTC. Chile (UTC-3): 09:00, 12:00, 15:00, 18:00, 21:00 y 23:00
    - cron: "0 12,15,18,21,0,2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Programas del sistema (video, fuentes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-noto-color-emoji > /dev/null

      - name: Dependencias de render
        working-directory: render
        run: npm ci --silent

      - name: Dependencias de Python
        run: pip install -q piper-tts numpy pillow

      - name: Voz (cache)
        uses: actions/cache@v4
        with:
          path: voces
          key: voz-es_MX-claude-high-v1

      - name: Descargar voz si falta
        run: |
          mkdir -p voces
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/claude/high
          [ -f voces/es_MX-claude-high.onnx ] || curl -sSL -o voces/es_MX-claude-high.onnx $B/es_MX-claude-high.onnx
          [ -f voces/es_MX-claude-high.onnx.json ] || curl -sSL -o voces/es_MX-claude-high.onnx.json $B/es_MX-claude-high.onnx.json

      - name: Publicar siguiente post de la cola
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # El 22-oct manda la maraton (maraton.yml); los horarios normales parten el 23-oct
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=America/Santiago date +%F)" = "2026-10-22" ]; then echo "Hoy publica la maraton"; exit 0; fi
          export CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          python3 scripts/publicar.py
