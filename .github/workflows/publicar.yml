name: Publicar en Instagram

on:
  schedule:
    # Horario UTC. Chile (UTC-3): 09:00, 15:00, 21:00 y 03:00
    - cron: "0 0,6,12,18 * * *"
    # Lanzamiento 22-oct (Chile): 16:30, 18:00, 19:30, 22:30 y 01:00 extra. BORRAR despues del 23-oct.
    - cron: "30 19,22 22 10 *"
    - cron: "0 21 22 10 *"
    - cron: "30 1 23 10 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar siguiente post de la cola
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: python3 scripts/publicar.py
