name: Publicar en Instagram

# Horarios en UTC (Chile = UTC-3). Se usa el minuto 7: las horas en punto son las mas
# congestionadas en GitHub y las ejecuciones se atrasan o se saltan.
on:
  schedule:
    # Lunes a jueves (Chile): 09:07, 12:07, 15:07, 18:07
    - cron: "7 12,15,18,21 * * 1-4"
    # Lunes a jueves (Chile): 21:07 y 23:07 -> en UTC ya es martes a viernes
    - cron: "7 0,2 * * 2-5"
    # Viernes, sabado y domingo (Chile): cada hora de 09:07 a 20:07
    - cron: "7 12-23 * * 5,6,0"
    # Viernes, sabado y domingo (Chile): 21:07, 22:07 y 23:07 -> en UTC sabado, domingo y lunes
    - cron: "7 0-2 * * 6,0,1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Programas del sistema (video, fuentes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-noto-color-emoji > /dev/null

      - name: Dependencias de render
        working-directory: render
        run: npm ci --silent

      - name: Dependencias de Python
        run: pip install -q piper-tts numpy pillow scipy kokoro-onnx

      - name: Voces (cache)
        uses: actions/cache@v4
        with:
          path: voces
          key: voces-piper-kokoro-v1

      - name: Descargar voces si faltan
        run: |
          mkdir -p voces
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/claude/high
          [ -f voces/es_MX-claude-high.onnx ] || curl -sSL -o voces/es_MX-claude-high.onnx $B/es_MX-claude-high.onnx
          [ -f voces/es_MX-claude-high.onnx.json ] || curl -sSL -o voces/es_MX-claude-high.onnx.json $B/es_MX-claude-high.onnx.json
          K=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f voces/kokoro-v1.0.onnx ] || curl -sSL -o voces/kokoro-v1.0.onnx $K/kokoro-v1.0.onnx
          [ -f voces/voices-v1.0.bin ] || curl -sSL -o voces/voices-v1.0.bin $K/voices-v1.0.bin

      - name: Publicar siguiente post de la cola
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          export CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export KOKORO_DIR=$PWD/voces
          python3 scripts/publicar.py
