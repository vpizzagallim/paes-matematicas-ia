name: Renovar token de Instagram

# El token de Instagram dura 60 dias; se renueva el dia 1 y 15 de cada mes.
on:
  schedule:
    - cron: "0 14 1,15 * *"
  workflow_dispatch: {}

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar y guardar el nuevo token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS --fail "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}")
          NUEVO=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$NUEVO"
          gh secret set IG_TOKEN --repo "$REPO" --body "$NUEVO"
          echo "Token renovado. Vigencia: $(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('expires_in'))") segundos"
